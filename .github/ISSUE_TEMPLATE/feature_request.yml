name: Feature request
description: Propose an improvement to the comparison reading workflow
title: "[Feature]: "
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Reading problem
      description: What comparison-reading task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-visible result rather than an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
